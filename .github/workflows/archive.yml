    steps:
    - name: "Checkout"
      uses: actions/checkout@v6

    # Note: No caching for this build!

    - name: "Update Archive"
      uses: martinthomson/i-d-template@v1
      env:
        ARCHIVE_FULL: ${{ inputs.archive_full }}
      with:
        make: archive
        token: ${{ github.token }}

    - name: "Update GitHub Pages"
      uses: martinthomson/i-d-template@v1
      with:
        make: gh-archive
        token: ${{ github.token }}

    - name: "Save Archive"
      uses: actions/upload-artifact@v6
      with:
        name: archive
        path: archive.json
